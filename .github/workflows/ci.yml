name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: WordPress coding standards
        run: composer lint

      - name: PHPStan, level 8
        run: composer analyse

  unit:
    name: Unit tests, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      # No database, no WordPress: the Access, Redirect, Dashboard, Auth and
      # Tools layers are plain PHP on purpose, and this is what that buys.
      - name: PHPUnit, unit suite
        run: composer test

  wordpress:
    name: Integration and security, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oxyarea_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Build the WordPress test environment
        id: wp
        env:
          WP_DB_NAME: oxyarea_tests
          WP_DB_USER: root
          WP_DB_PASSWORD: root
          WP_DB_HOST: 127.0.0.1
        run: |
          config="$(scripts/wordpress-test-env.sh)"
          echo "config=${config}" >>"$GITHUB_OUTPUT"

      # These are the release gate: private content must not leak through
      # search, feeds, archives, sitemaps or REST, and one customer must not
      # reach another's. A red run here is a stop, not a warning.
      - name: PHPUnit, integration suite
        env:
          WP_PHPUNIT__TESTS_CONFIG: ${{ steps.wp.outputs.config }}
        run: composer test:integration

      - name: PHPUnit, security suite
        env:
          WP_PHPUNIT__TESTS_CONFIG: ${{ steps.wp.outputs.config }}
        run: composer test:security

  package:
    name: Distributable package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # What ships is what `git archive` produces, so what ships is what gets
      # checked. .gitattributes is easy to forget when a directory is added,
      # and the plugin directory's reviewers are not.
      - name: Build it the way the release does
        run: |
          mkdir -p build
          git archive --format=tar --prefix=oxyarea/ HEAD | tar -x -C build

      - name: Nothing that belongs to development may be in it
        run: |
          status=0
          for unwanted in vendor tests scripts docs .github composer.json phpunit.xml.dist phpcs.xml.dist phpstan.neon.dist README.md; do
            if [ -e "build/oxyarea/${unwanted}" ]; then
              echo "::error::${unwanted} would be shipped to users."
              status=1
            fi
          done

          hidden="$(find build/oxyarea -name '.*' -not -name '.' -print)"
          if [ -n "${hidden}" ]; then
            echo "::error::the plugin directory rejects hidden files: ${hidden}"
            status=1
          fi

          exit "${status}"

      - name: And everything users need must be
        run: |
          status=0
          for required in oxyarea.php readme.txt uninstall.php LICENSE src templates assets languages; do
            if [ ! -e "build/oxyarea/${required}" ]; then
              echo "::error::${required} is missing from the package."
              status=1
            fi
          done

          exit "${status}"

      - name: Every shipped file must parse
        run: find build/oxyarea -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: oxyarea-plugin
          path: build/oxyarea
          if-no-files-found: error
